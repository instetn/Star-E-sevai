<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="Poppins, Arial, sans-serif">
  <defs>
    <linearGradient id="hg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="hg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8effc"/>
    </linearGradient>
  </defs>
  <!-- glow circles -->
  <circle cx="260" cy="210" r="190" fill="rgba(255,255,255,0.06)"/>
  <circle cx="260" cy="210" r="140" fill="rgba(255,255,255,0.07)"/>
  <!-- main document card -->
  <g transform="translate(140 70)">
    <rect x="0" y="0" width="240" height="300" rx="18" fill="url(#hg2)" stroke="#c7d6f5" stroke-width="2"/>
    <rect x="22" y="24" width="120" height="14" rx="7" fill="#1e3a8a"/>
    <rect x="22" y="50" width="196" height="9" rx="4.5" fill="#cbd5e1"/>
    <rect x="22" y="68" width="170" height="9" rx="4.5" fill="#cbd5e1"/>
    <rect x="22" y="86" width="186" height="9" rx="4.5" fill="#cbd5e1"/>
    <!-- photo box -->
    <rect x="22" y="112" width="64" height="74" rx="8" fill="#dbeafe"/>
    <circle cx="54" cy="138" r="13" fill="#2563eb"/>
    <path d="M32 178c3-14 12-21 22-21s19 7 22 21z" fill="#2563eb"/>
    <!-- fields -->
    <rect x="100" y="116" width="118" height="9" rx="4.5" fill="#94a3b8"/>
    <rect x="100" y="135" width="96" height="9" rx="4.5" fill="#cbd5e1"/>
    <rect x="100" y="154" width="108" height="9" rx="4.5" fill="#cbd5e1"/>
    <rect x="100" y="173" width="80" height="9" rx="4.5" fill="#cbd5e1"/>
    <!-- barcode -->
    <g fill="#1e3a8a" transform="translate(22 210)">
      <rect width="5" height="34"/><rect x="9" width="3" height="34"/><rect x="16" width="7" height="34"/>
      <rect x="27" width="3" height="34"/><rect x="34" width="5" height="34"/><rect x="43" width="9" height="34"/>
      <rect x="56" width="3" height="34"/><rect x="63" width="6" height="34"/><rect x="73" width="4" height="34"/>
      <rect x="81" width="8" height="34"/><rect x="93" width="3" height="34"/><rect x="100" width="6" height="34"/>
    </g>
    <!-- approved stamp -->
    <g transform="translate(150 215) rotate(-12)">
      <rect x="-8" y="-8" width="92" height="40" rx="8" fill="none" stroke="#16a34a" stroke-width="3"/>
      <text x="38" y="18" text-anchor="middle" fill="#16a34a" font-size="15" font-weight="700">APPROVED</text>
    </g>
  </g>
  <!-- floating check badge -->
  <g transform="translate(64 96)">
    <circle cx="34" cy="34" r="34" fill="url(#hg1)"/>
    <path d="M19 35l10 10 20-21" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- floating ID chip card -->
  <g transform="translate(356 270)">
    <rect width="120" height="76" rx="12" fill="#f59e0b"/>
    <rect x="12" y="14" width="26" height="20" rx="4" fill="#fde9c8"/>
    <rect x="12" y="46" width="96" height="7" rx="3.5" fill="#fff" opacity=".85"/>
    <rect x="12" y="59" width="64" height="7" rx="3.5" fill="#fff" opacity=".6"/>
  </g>
  <!-- floating gear -->
  <g transform="translate(396 64)" fill="#93c5fd">
    <circle cx="30" cy="30" r="13" fill="none" stroke="#93c5fd" stroke-width="7"/>
    <g stroke="#93c5fd" stroke-width="7" stroke-linecap="round">
      <path d="M30 4v9M30 47v9M4 30h9M47 30h9M12 12l6 6M42 42l6 6M48 12l-6 6M18 42l-6 6"/>
    </g>
  </g>
  <!-- india-flag dot accents -->
  <circle cx="92" cy="330" r="9" fill="#f59e0b"/>
  <circle cx="118" cy="352" r="6" fill="#ffffff" opacity=".8"/>
  <circle cx="78" cy="362" r="7" fill="#16a34a"/>
</svg>
